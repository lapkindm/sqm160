[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqm160"
version = "0.1.0"
description = "Python interface for the INFICON SQM-160 Thin Film Deposition Monitor"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Dmitry Lapkin", email = "dmitry.lapkin@uni-tuebingen.com"}
]

license = { file = "LICENSE" }

keywords = [
    "inficon",
    "sqm160",
    "thin-film",
    "vacuum",
    "qcm",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "pyusb>=1.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]